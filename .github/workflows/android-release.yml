# Builds the signed Android App Bundle (.aab) for the Play Store.
# Run it by hand: GitHub → Actions → «Android release (Play Store)» → Run
# workflow, with a build number higher than the last one on Google Play.
# The upload key comes from the repository secrets:
#   ANDROID_KEYSTORE_BASE64   the .jks file, base64
#   ANDROID_KEYSTORE_PASSWORD storePassword
#   ANDROID_KEY_PASSWORD      keyPassword
#   ANDROID_KEY_ALIAS         keyAlias
name: Android release (Play Store)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (versionCode) — μεγαλύτερο από το τελευταίο στο Google Play'
        required: true
      build_name:
        description: 'Έκδοση (versionName), π.χ. 1.3.0 — κενό = από το pubspec.yaml'
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Create app_config.dart
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          mkdir -p lib/core/config
          cat > lib/core/config/app_config.dart <<EOT
          class AppConfig {
            static const String openWeatherApiKey = '${OPENWEATHER_API_KEY}';
          }
          EOT

      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Λείπουν τα μυστικά ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOT
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOT

      - run: flutter pub get

      - name: Build app bundle
        run: |
          set -o pipefail
          ARGS="--release --build-number=${{ inputs.build_number }}"
          if [ -n "${{ inputs.build_name }}" ]; then ARGS="$ARGS --build-name=${{ inputs.build_name }}"; fi
          if ! flutter build appbundle $ARGS 2>&1 | tee build.log; then
            grep -nE "error|Error|FAILURE|What went wrong|Keystore|password" build.log | tail -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            exit 1
          fi

      - name: Remove key files
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: clubera-play-store-${{ inputs.build_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
